---
extends: []
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: oxlint
            glob:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
              - "**/*.{astro,vue,svelte}"
            run: "mise x -- oxlint --deny-warnings -- {staged_files}"
            tags:
              - common-tools:oxlint
              - lint
              - javascript
              - typescript
              - framework
              - oxlint
