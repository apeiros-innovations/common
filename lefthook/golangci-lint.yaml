---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: golangci lint
            only:
              - run: test -f .golangci.yml || test -f .golangci.yaml || test -f .golangci.toml || test -f .golangci.json
            glob:
              - "**/*.go"
            run: |
              mise x -- \
                bash -e -o pipefail -c '
                  patch="$(mktemp)"
                  trap "rm -f -- \"$patch\"" EXIT

                  git --no-pager diff \
                    --cached \
                    --no-ext-diff \
                    --no-textconv \
                    --unified=0 \
                    -- \
                    ":(glob)**/*.go" >"$patch"

                  [ -s "$patch" ] || exit 0

                  golangci-lint run \
                    --new-from-patch="$patch" \
                    --whole-files
                '
            tags:
              - lint
              - go
              - golangci-lint
