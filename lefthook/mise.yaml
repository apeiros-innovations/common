---
extends: []
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: "format mise"
            glob:
              - "mise.toml"
              - ".mise.toml"
              - "mise/config.toml"
              - "mise/conf.d/*.toml"
              - ".mise/config.toml"
              - ".mise/conf.d/*.toml"
              - ".config/mise/config.toml"
              - ".config/mise/conf.d/*.toml"
              - "mise.lock"
              - ".mise/mise.lock"
              - ".config/mise/mise.lock"
            run: "mise fmt"
            stage_fixed: true
            tags:
              - common-tools:system
              - format
              - mise
    - name: generate
      skip: false
      group:
        jobs:
          - name: "mise lock"
            glob:
              - "mise.toml"
              - ".mise.toml"
              - "mise/config.toml"
              - "mise/conf.d/*.toml"
              - ".mise/config.toml"
              - ".mise/conf.d/*.toml"
              - ".config/mise/config.toml"
              - ".config/mise/conf.d/*.toml"
              - "mise.lock"
              - ".mise/mise.lock"
              - ".config/mise/mise.lock"
            run: |
              mise lock
              found=false
              for lockfile in mise.lock .mise/mise.lock .config/mise/mise.lock; do
                [ -f "$lockfile" ] || continue
                git add -- "$lockfile"
                found=true
              done
              if [ "$found" = false ]; then
                printf >&2 'mise: no lockfile after `mise lock`; enable [settings].lockfile\n'
                exit 1
              fi
            tags:
              - common-tools:system
              - generation
              - mise
              - dependencies
              - supply-chain
