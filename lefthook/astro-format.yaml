---
extends: []
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: "format astro"
            glob:
              - "**/*.astro"
            run: "mise x -- pnpm exec prettier --write {staged_files}"
            stage_fixed: true
            tags:
              - common-tools:pnpm
              - format
              - astro
              - prettier
