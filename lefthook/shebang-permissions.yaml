---
extends: []
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: "shebang permissions"
            exclude:
              - "**/{.justfile,justfile,Justfile}"
              - "**/*.just"
            file_types:
              - text
              - "not symlink"
            script: "shebang-permissions.py"
            runner: "mise x -- python3"
            args: "{staged_files}"
            tags:
              - common-tools:repository
              - validation
              - repository
              - permissions
