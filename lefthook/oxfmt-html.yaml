---
extends: []
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: "format html"
            glob:
              - "**/*.{html,htm,xhtml}"
            exclude:
              - "**/templates/**"
            script: oxfmt
            runner: bash
            args: "--write {staged_files}"
            stage_fixed: true
            tags:
              - common-tools:oxfmt
              - format
              - html
              - oxfmt
