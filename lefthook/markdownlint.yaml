---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: markdownlint
            glob:
              - "**/*.{md,markdown}"
            script: markdownlint
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - markdown
              - markdownlint
              - ci
            file_types:
              - not symlink
