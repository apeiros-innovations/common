---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: zizmor
            glob:
              - .github/workflows/**/*.{yaml,yml}
              - .github/actions/**/action.{yaml,yml}
              - .github/dependabot.{yaml,yml}
            script: zizmor
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - security
              - github
              - github-actions
              - zizmor
              - ci
            file_types:
              - not symlink
