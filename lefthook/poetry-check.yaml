---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: poetry configuration
            run: mise x -- poetry check --lock --strict
            fail_text: Poetry configuration or poetry.lock is inconsistent. Run `mise x -- poetry lock`, review poetry.lock, and stage the result.
            tags:
              - validation
              - python
              - poetry
              - dependencies
              - supply-chain
            only:
              - run: test -f pyproject.toml
            glob:
              - pyproject.toml
              - poetry.lock
              - "**/*.{py,pyi,pyw}"
            file_types:
              - not symlink
