---
extends: []
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: "format go"
            group:
              jobs:
                - name: goimports
                  glob:
                    - "**/*.go"
                  run: "mise x -- goimports -w {staged_files}"
                  stage_fixed: true
                  tags:
                    - format
                    - go
                    - goimports
                - name: "gofmt simplify"
                  glob:
                    - "**/*.go"
                  run: "mise x -- gofmt -s -w {staged_files}"
                  stage_fixed: true
                  tags:
                    - format
                    - go
                    - gofmt
              piped: true
