---
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: format django templates
            only:
              - run: |
                  [ -f djlint.toml ] && exit 0
                  [ -f .djlint.toml ] && exit 0
                  [ -f .djlintrc ] && exit 0

                  if [ -f pyproject.toml ] &&
                     grep -Eq \
                       '^[[:space:]]*\[tool\.djlint([.][^]]+)?\]' \
                       pyproject.toml; then
                    exit 0
                  fi

                  exit 1
            glob:
              - "**/templates/**/*.{html,htm}"
            run: mise x -- djlint --profile=django --reformat --quiet {staged_files}
            stage_fixed: true
            tags:
              - format
              - django
              - templates
              - djlint
              - ci
