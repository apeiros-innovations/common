---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: lint yaml
            glob:
              - "**/*.{yaml,yml}"
            exclude:
              - "**/templates/**"
              - .mise/locks/**
              - .config/mise/locks/**
            script: yamllint
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - yaml
              - yamllint
              - ci
            file_types:
              - not symlink
