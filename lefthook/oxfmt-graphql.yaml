---
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: format graphql
            glob:
              - "**/*.{graphql,gql,graphqls}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - graphql
              - oxfmt
              - ci
