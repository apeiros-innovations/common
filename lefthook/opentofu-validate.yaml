---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: opentofu validate
            glob:
              - "**/*.{tf,tofu,tfvars}"
              - "**/*.{tf,tofu,tfvars}.json"
              - "**/.terraform.lock.hcl"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: validate {staged_files}
            tags:
              - validation
              - opentofu
