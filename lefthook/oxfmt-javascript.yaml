---
pre-commit:
  jobs:
    - name: format
      skip: false
      group:
        jobs:
          - name: format javascript typescript
            glob:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - javascript
              - typescript
              - oxfmt
              - ci
            file_types:
              - not symlink
