---
pre-commit:
  jobs:
    - name: validate
      skip: false
      group:
        jobs:
          - name: terragrunt validation
            group:
              jobs:
                - name: terragrunt validate inputs
                  glob:
                    - "**/*.hcl"
                  exclude:
                    - "**/.terraform/**"
                    - "**/.terragrunt-cache/**"
                    - "**/.terraform.lock.hcl"
                    - "**/.tflint.hcl"
                    - "**/*.{tftest,tofutest,tfmock,tfquery}.hcl"
                  script: terragrunt
                  runner: mise x -- bash
                  args: validate-inputs {staged_files}
                  tags:
                    - validation
                    - inputs
                    - terragrunt
                  file_types:
                    - not symlink
