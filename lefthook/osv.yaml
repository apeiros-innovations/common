---
extends: []
pre-commit:
  jobs:
    - name: validate
      group:
        jobs:
          - name: "osv scanner"
            glob:
              - "**/conan.lock"
              - "**/pubspec.lock"
              - "**/mix.lock"
              - "**/go.mod"
              - "**/cabal.project.freeze"
              - "**/stack.yaml.lock"
              - "**/buildscript-gradle.lockfile"
              - "**/gradle.lockfile"
              - "**/gradle/verification-metadata.xml"
              - "**/pom.xml"
              - "**/bun.lock"
              - "**/package-lock.json"
              - "**/pnpm-lock.yaml"
              - "**/yarn.lock"
              - "**/deps.json"
              - "**/packages.config"
              - "**/packages.lock.json"
              - "**/composer.lock"
              - "**/Pipfile.lock"
              - "**/poetry.lock"
              - "**/requirements.txt"
              - "**/pdm.lock"
              - "**/pylock.toml"
              - "**/uv.lock"
              - "**/renv.lock"
              - "**/Gemfile.lock"
              - "**/gems.locked"
              - "**/Cargo.lock"
            script: osv-scanner
            runner: "mise x -- bash"
            args: "{staged_files}"
            tags:
              - common-tools:osv
              - security
              - dependencies
              - osv
      skip: false
osv-scan:
  jobs:
    - name: repository
      run: "mise x -- osv-scanner scan source --format=vertical --verbosity=error --recursive ."
      tags:
        - common-tools:osv
        - security
        - dependencies
        - osv
osv-remediate-npm:
  jobs:
    - name: "guided remediation"
      only:
        - run: "test -f package.json && test -f package-lock.json"
      run: "mise x -- osv-scanner fix --interactive -M package.json -L package-lock.json"
      interactive: true
      tags:
        - common-tools:osv
        - security
        - dependencies
        - osv
        - remediation
        - npm
