---
pre-commit:
  parallel: false

  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: opentofu fmt
            glob:
              - "**/*.{tf,tofu,tfvars}"
              - "**/*.{tftest,tofutest,tfmock,tfquery}.hcl"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: "fmt {staged_files}"
            stage_fixed: true
            tags:
              - format
              - opentofu

    - name: generate
      group:
        parallel: true
        jobs:
          - name: opentofu docs
            glob:
              - "**/*.{tf,tofu}"
              - "**/*.{tf,tofu}.json"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: "docs {staged_files}"
            tags:
              - documentation
              - generation
              - opentofu
              - terraform-docs

          - name: opentofu provider lock
            glob:
              - "**/*.{tf,tofu}"
              - "**/*.{tf,tofu}.json"
              - "**/.terraform.lock.hcl"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: "providers-lock {staged_files}"
            tags:
              - dependencies
              - generation
              - supply-chain
              - opentofu
              - providers

    - name: validate
      group:
        parallel: true
        jobs:
          - name: opentofu tflint
            glob:
              - "**/*.{tf,tofu,tfvars}"
              - "**/*.{tf,tofu,tfvars}.json"
              - "**/.terraform.lock.hcl"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: "tflint {staged_files}"
            tags:
              - lint
              - validation
              - opentofu
              - tflint

          - name: opentofu trivy
            glob:
              - "**/*.{tf,tofu,tfvars}"
              - "**/*.{tf,tofu,tfvars}.json"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: "trivy {staged_files}"
            tags:
              - security
              - validation
              - opentofu
              - trivy

          - name: opentofu validate
            glob:
              - "**/*.{tf,tofu,tfvars}"
              - "**/*.{tf,tofu,tfvars}.json"
              - "**/.terraform.lock.hcl"
            exclude:
              - "**/.terraform/**"
              - "**/.terragrunt-cache/**"
            script: opentofu
            runner: mise x -- bash
            args: "validate {staged_files}"
            tags:
              - validation
              - opentofu
