---
pre-commit:
  jobs:
    - name: validate
      group:
        parallel: true
        jobs:
          - name: dependency vulnerabilities
            glob:
              - "**/conan.lock"
              - "**/pubspec.lock"
              - "**/mix.lock"
              - "**/go.mod"
              - "**/cabal.project.freeze"
              - "**/stack.yaml.lock"
              - "**/buildscript-gradle.lockfile"
              - "**/gradle.lockfile"
              - "**/gradle/verification-metadata.xml"
              - "**/pom.xml"
              - "**/bun.lock"
              - "**/package-lock.json"
              - "**/pnpm-lock.yaml"
              - "**/yarn.lock"
              - "**/deps.json"
              - "**/packages.config"
              - "**/packages.lock.json"
              - "**/composer.lock"
              - "**/Pipfile.lock"
              - "**/poetry.lock"
              - "**/requirements.txt"
              - "**/pdm.lock"
              - "**/pylock.toml"
              - "**/uv.lock"
              - "**/renv.lock"
              - "**/Gemfile.lock"
              - "**/gems.locked"
              - "**/Cargo.lock"
            script: dependency-security
            runner: mise x -- bash
            args: "scan {staged_files}"
            tags:
              - security
              - dependencies
              - osv

dependency-scan:
  jobs:
    - name: scan
      run: >-
        mise x -- python3 .lefthook/lib/dependency-security.py scan-repository
      tags:
        - security
        - dependencies
        - osv

dependency-remediate:
  jobs:
    - name: remediate
      run: >-
        mise x -- python3 .lefthook/lib/dependency-security.py remediate
      interactive: true
      tags:
        - security
        - dependencies
        - remediation
