---
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test shared actions
    runs-on:
      group: gha-shared
      labels: gha-linux-k8s
    timeout-minutes: 10
    env:
      MISE_ENV: ci
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          install_args: --locked node
          add_shims_to_path: false
          cache: false
      - name: Check aggregation, readiness, and retry safety
        run: node --test tests/ci-gate/*.test.mjs tests/lint-files/*.test.mjs
  yamllint:
    uses: $/.github/workflows/yamllint.yaml
    with:
      # Qualify the new interfaces; expand legacy YAML coverage separately.
      files: |
        .github/workflows/ci.yaml
        .github/workflows/yamllint.yaml
        .github/workflows/markdownlint.yaml
        .github/workflows/shellcheck.yaml
        .github/workflows/actionlint.yaml
        .github/workflows/zizmor.yaml
        .github/actions/lint-files/action.yaml
  markdownlint:
    uses: $/.github/workflows/markdownlint.yaml
  shellcheck:
    uses: $/.github/workflows/shellcheck.yaml
  actionlint:
    uses: $/.github/workflows/actionlint.yaml
  zizmor:
    uses: $/.github/workflows/zizmor.yaml
  status:
    name: Build Success
    if: ${{ always() }}
    needs: [test, yamllint, markdownlint, shellcheck, actionlint, zizmor]
    runs-on:
      group: gha-shared
      labels: gha-linux-k8s
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        uses: $/.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"test":true,"yamllint":true,"markdownlint":true,"shellcheck":true,"actionlint":true,"zizmor":true}
