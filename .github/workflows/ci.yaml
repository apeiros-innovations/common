---
name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test maintenance actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_ENV: ci
      MISE_ENABLE_TOOLS: node,aqua:evilmartians/lefthook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: --locked node aqua:evilmartians/lefthook
          add_shims_to_path: false
          cache: false
      - name: Check aggregation, readiness, and retry safety
        run: node --test tests/ci-gate/*.test.mjs tests/lint/*.test.mjs
  shared-lint:
    uses: $/.github/workflows/lint.yaml
    with:
      tools: aqua:kjanat/actionlint aqua:koalaman/shellcheck aqua:zizmorcore/zizmor
      expected-checks: '["actionlint", "shellcheck", "zizmor"]'
      config: .github/lint.lefthook.yaml
  workflow-lint:
    uses: $/.github/workflows/workflow-lint.yaml
    permissions:
      contents: read
      checks: write
      pull-requests: write
  status:
    name: Build Success
    if: ${{ always() }}
    needs: [test, workflow-lint, shared-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        uses: $/.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
          expected: '{"test":true,"workflow-lint":true,"shared-lint":true}'
