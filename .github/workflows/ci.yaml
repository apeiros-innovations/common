---
name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test maintenance actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_ENV: ci
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: --locked node
          add_shims_to_path: false
          cache: false
      - name: Check aggregation, readiness, and retry safety
        run: node --test tests/ci-gate/*.test.mjs
  workflow-lint:
    uses: $/.github/workflows/workflow-lint.yaml
    permissions:
      contents: read
      checks: write
      pull-requests: write
  status:
    name: Build Success
    if: ${{ always() }}
    needs: [test, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        uses: $/.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
          expected: '{"test":true,"workflow-lint":true}'
