---
name: Zizmor
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON Linux runner label, label array, or group/labels mapping; empty selects by caller visibility.
        type: string
        default: ""
      files:
        description: Newline-separated Git pathspecs; empty uses the selected Common release's linter scope.
        type: string
        default: ""
      trigger-files:
        description: Additional Git pathspecs whose changes require this linter, such as sourced scripts or custom rules.
        type: string
        default: ""
      full-scan:
        description: Check the entire file scope without change detection; use after a shared preflight selects this job.
        type: boolean
        default: false
      config:
        description: Repository-relative configuration override; empty uses the selected Common release's defaults.
        type: string
        default: ""
      offline:
        description: Disable GitHub API audits when explicitly requested.
        type: boolean
        default: false
      audit-repositories:
        description: Optional private repositories in the caller's owner to audit with a read-only GitHub App token.
        type: string
        default: ""
    secrets:
      audit-app-client-id:
        description: Existing GitHub App client ID; required when audit-repositories is set.
        required: false
      audit-app-private-key:
        description: Existing GitHub App private key; required when audit-repositories is set.
        required: false
permissions:
  contents: read
jobs:
  lint:
    name: Zizmor
    # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
    runs-on: ${{ fromJSON(inputs.runs-on || (github.event.repository.private && '{"group":"gha-shared","labels":"gha-linux-k8s"}' || '"ubuntu-24.04"')) }}
    timeout-minutes: 10
    env:
      MISE_ENV: ci
      MISE_ENABLE_TOOLS: aqua:zizmorcore/zizmor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.full-scan && 1 || 0 }}
      - name: Select affected lint scope
        id: files
        uses: $/.github/actions/lint-files
        with:
          linter: zizmor
          files: ${{ inputs.files }}
          config: ${{ inputs.config }}
          trigger-files: ${{ inputs.trigger-files }}
          full-scan: ${{ inputs.full-scan }}
      - name: Install locked tools from Common
        if: steps.files.outputs.any == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.files.outputs.common-directory }}
        with:
          working_directory: ${{ steps.files.outputs.common-directory }}
          install_args: --locked aqua:zizmorcore/zizmor
          cache: false
          add_shims_to_path: false
          env: true
      - name: Create a read-only private action audit token
        if: steps.files.outputs.any == 'true' && !inputs.offline && inputs.audit-repositories != ''
        id: audit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.audit-app-client-id }}
          private-key: ${{ secrets.audit-app-private-key }}
          repositories: ${{ inputs.audit-repositories }}
          permission-contents: read
      - name: Zizmor
        if: steps.files.outputs.any == 'true'
        shell: bash
        env:
          LINT_FILES: ${{ steps.files.outputs.file-list }}
          LINT_CONFIG: ${{ inputs.config || format('{0}/.github/zizmor.yaml', steps.files.outputs.common-directory) }}
          LINT_OFFLINE: ${{ inputs.offline }}
          GH_TOKEN: ${{ steps.audit-token.outputs.token || github.token }}
        run: |
          args=(--format=github --config "$LINT_CONFIG")
          if [[ "$LINT_OFFLINE" == true ]]; then args+=(--offline); fi
          xargs -0 -r zizmor "${args[@]}" -- < "$LINT_FILES"
