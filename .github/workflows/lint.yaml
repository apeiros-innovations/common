---
name: Shared lint
on:
  workflow_call:
    inputs:
      tools:
        description: Space-separated Mise tool names needed by the selected checks; node and lefthook are always included.
        required: true
        type: string
      expected-checks:
        description: JSON array of required leaf job names carrying the ci tag in the merged Lefthook configuration.
        required: true
        type: string
      config:
        description: Optional repository-relative Lefthook configuration; otherwise use normal Lefthook discovery.
        default: ''
        type: string
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
      - name: Run the repository's CI checks
        uses: $/.github/actions/lint
        with:
          tools: ${{ inputs.tools }}
          expected-checks: ${{ inputs.expected-checks }}
          config: ${{ inputs.config }}
