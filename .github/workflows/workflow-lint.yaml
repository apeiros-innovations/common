---
name: Workflow lint
on:
  pull_request:
    paths:
      - ".github/**"
      - .config/mise.toml
      - .config/mise.lock
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - .config/mise.toml
      - .config/mise.lock
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install: false
          cache: false
          env: false
          export_path: false
      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get --file .config/mise.toml tools.aqua:rhysd/actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get --file .config/mise.toml tools.aqua:zizmorcore/zizmor)" >> "$GITHUB_OUTPUT"
      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@1d6eebfd2066f2aa84939e573e56f60d8d2ed85f  # workflow-lint-v1.0.4
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}
