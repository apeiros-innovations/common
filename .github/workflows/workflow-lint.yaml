---
# Compatibility entry point; new callers should compose individual lint workflows.
name: Workflow lint
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON Linux runner label, label array, or group/labels mapping; empty selects by caller visibility.
        type: string
        default: ""
permissions:
  contents: read
jobs:
  actionlint:
    uses: $/.github/workflows/actionlint.yaml
    with:
      runs-on: ${{ inputs.runs-on }}
  shellcheck:
    uses: $/.github/workflows/shellcheck.yaml
    with:
      runs-on: ${{ inputs.runs-on }}
  zizmor:
    uses: $/.github/workflows/zizmor.yaml
    with:
      runs-on: ${{ inputs.runs-on }}
  lint:
    if: ${{ always() }}
    needs: [actionlint, shellcheck, zizmor]
    # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
    runs-on: ${{ fromJSON(inputs.runs-on || (github.event.repository.private && '{"group":"gha-shared","labels":"gha-linux-k8s"}' || '"ubuntu-24.04"')) }}
    timeout-minutes: 5
    steps:
      - name: Require all workflow checks
        shell: bash
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in "$ACTIONLINT_RESULT" "$SHELLCHECK_RESULT" "$ZIZMOR_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::A required workflow check did not succeed ($result)."
              exit 1
            fi
          done
