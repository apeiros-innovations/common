---
# Compatibility entry point; new callers should compose individual lint workflows.
name: Workflow lint
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  actionlint:
    uses: $/.github/workflows/actionlint.yaml
  shellcheck:
    uses: $/.github/workflows/shellcheck.yaml
  zizmor:
    uses: $/.github/workflows/zizmor.yaml
  lint:
    if: ${{ always() }}
    needs: [actionlint, shellcheck, zizmor]
    runs-on:
      group: gha-shared
      labels: gha-linux-k8s
    timeout-minutes: 5
    steps:
      - name: Require all workflow checks
        shell: bash
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in "$ACTIONLINT_RESULT" "$SHELLCHECK_RESULT" "$ZIZMOR_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::A required workflow check did not succeed ($result)."
              exit 1
            fi
          done
