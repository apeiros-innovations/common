name: Workflow lint
on:
  workflow_call:
permissions:
  contents: read
env:
  MISE_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck archive support
        shell: bash
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xz-utils
          fi
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
      - name: Read tool versions from mise
        id: tool-versions
        shell: bash
        run: |
          versions=$(env -u MISE_ENABLE_TOOLS mise ls --current --json | jq -c 'map_values(.[0].version)')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - name: Set up Python for workflow checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ fromJSON(steps.tool-versions.outputs.versions)['python'] }}
      - name: Lint workflows with reviewdog
        uses: reviewdog/action-actionlint/dockerless@cfa6a621f27735ccc88d35af9d0608692fd9b9f7  # v1.80.8
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
      - name: Check shell scripts with reviewdog
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427  # v1.34.1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
          check_all_files_with_shebangs: true
          pattern: |
            *.sh
            *.bash
            *.bats
          exclude: |
            */.git/*
            */node_modules/*
            */vendor/*
            */.venv/*
            */.mise/locks/*
            */_output/*
            */dist/*
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          version: ${{ fromJSON(steps.tool-versions.outputs.versions)['aqua:zizmorcore/zizmor'] }}
          inputs: .github
          advanced-security: false
          annotations: true
    permissions:
      contents: read
      checks: write
      pull-requests: write