---
name: PR title check

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on:
      group: gha-shared
      labels: gha-linux-k8s
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commit title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
