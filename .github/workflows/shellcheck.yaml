---
name: ShellCheck
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON Linux runner label, label array, or group/labels mapping; empty selects by caller visibility.
        type: string
        default: ""
      files:
        description: Newline-separated Git pathspecs; empty uses the selected Common release's linter scope.
        type: string
        default: ""
      trigger-files:
        description: Additional Git pathspecs whose changes require this linter, such as sourced scripts or custom rules.
        type: string
        default: ""
      full-scan:
        description: Check the entire file scope without change detection; use after a shared preflight selects this job.
        type: boolean
        default: false
      config:
        description: Repository-relative configuration override; empty uses the selected Common release's defaults.
        type: string
        default: ""
permissions:
  contents: read
jobs:
  lint:
    name: ShellCheck
    # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
    runs-on: ${{ fromJSON(inputs.runs-on || (github.event.repository.private && '{"group":"gha-shared","labels":"gha-linux-k8s"}' || '"ubuntu-24.04"')) }}
    timeout-minutes: 10
    env:
      MISE_ENV: ci
      MISE_ENABLE_TOOLS: aqua:koalaman/shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.full-scan && 1 || 0 }}
      - name: Select affected lint scope
        id: files
        uses: $/.github/actions/lint-files
        with:
          linter: shellcheck
          files: ${{ inputs.files }}
          config: ${{ inputs.config }}
          trigger-files: ${{ inputs.trigger-files }}
          full-scan: ${{ inputs.full-scan }}
      - name: Install locked tools from Common
        if: steps.files.outputs.any == 'true'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.files.outputs.common-directory }}
        with:
          working_directory: ${{ steps.files.outputs.common-directory }}
          install_args: --locked aqua:koalaman/shellcheck
          cache: false
          add_shims_to_path: false
          env: true
      - name: ShellCheck
        if: steps.files.outputs.any == 'true'
        shell: bash
        env:
          LINT_FILES: ${{ steps.files.outputs.file-list }}
          LINT_CONFIG: ${{ inputs.config || format('{0}/.shellcheckrc', steps.files.outputs.common-directory) }}
        run: |
          xargs -0 -r shellcheck --rcfile="$LINT_CONFIG" -- < "$LINT_FILES"
