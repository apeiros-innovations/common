---
name: Hook configuration
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.8.12"
          install_args: python node aqua:evilmartians/lefthook npm:cspell
          cache: false
      - name: Verify generated tool requirements
        run: mise run tools:check
      - name: Verify module composition and hook behavior
        run: mise x -- python -m unittest discover -s tests -v
