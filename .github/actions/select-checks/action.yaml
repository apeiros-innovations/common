---
name: Select checks
description: Select CI jobs from native Git pathspecs and semantic Mise tool changes.
inputs:
  policy:
    description: Repository-relative JSON dependency policy.
    default: .github/ci-impact.json
outputs:
  selected:
    description: JSON object containing a boolean for every policy job.
    value: ${{ steps.select.outputs.selected }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        SELECT_ACTION_PATH: ${{ github.action_path }}
        SELECT_POLICY: ${{ inputs.policy }}
      run: python3 "$SELECT_ACTION_PATH/select.py"
