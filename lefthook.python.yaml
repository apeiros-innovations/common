---
pre-commit:
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: format python
            group:
              parallel: false
              jobs:
                - name: ruff fix
                  glob:
                    - "**/*.{py,pyi,pyw}"
                  run: >-
                    mise x -- ruff check --fix-only --force-exclude {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - lint
                    - python
                    - ruff

                - name: ruff format
                  glob:
                    - "**/*.{py,pyi,pyw}"
                  run: >-
                    mise x -- ruff format --force-exclude {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - python
                    - ruff

    - name: validate
      group:
        parallel: true
        jobs:
          - name: ruff
            glob:
              - "**/*.{py,pyi,pyw}"
            run: >-
              mise x -- ruff check --force-exclude {staged_files}
            tags:
              - lint
              - python
              - ruff
