---
pre-commit:
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: format python
            group:
              jobs:
                - name: django upgrade
                  only:
                    - run: |
                        [ -f pyproject.toml ] || exit 1

                        python3 - <<'PY'
                        import pathlib
                        import re
                        import tomllib

                        path = pathlib.Path("pyproject.toml")
                        data = tomllib.loads(path.read_text(encoding="utf-8"))

                        dependencies = data.get("project", {}).get(
                            "dependencies",
                            [],
                        )

                        pattern = re.compile(
                            r"^\s*django(?:\[[^\]]+\])?\s*"
                            r"(?:===|==|~=|!=|<=|>=|<|>)",
                            re.IGNORECASE,
                        )

                        raise SystemExit(
                            0
                            if any(
                                pattern.search(dependency)
                                for dependency in dependencies
                            )
                            else 1
                        )
                        PY
                  glob:
                    - "**/*.py"
                  run: >-
                    django-upgrade --exit-zero-even-if-changed {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - python
                    - django
                    - django-upgrade

                - name: ruff fix
                  only: &ruff-config-present
                    - run: |
                        [ -f .ruff.toml ] && exit 0
                        [ -f ruff.toml ] && exit 0

                        if [ -f pyproject.toml ] &&
                           grep -Eq \
                             '^[[:space:]]*\[tool\.ruff([.][^]]+)?\]' \
                             pyproject.toml; then
                          exit 0
                        fi

                        exit 1
                  glob:
                    - "**/*.{py,pyi,pyw}"
                  run: >-
                    ruff check --fix-only --force-exclude {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - lint
                    - python
                    - ruff

                - name: ruff format
                  only: *ruff-config-present
                  glob:
                    - "**/*.{py,pyi,pyw}"
                  run: >-
                    ruff format --force-exclude {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - python
                    - ruff

    - name: validate
      group:
        parallel: true
        jobs:
          - name: ruff
            only: *ruff-config-present
            glob:
              - "**/*.{py,pyi,pyw}"
            run: >-
              ruff check --force-exclude {staged_files}
            tags:
              - lint
              - python
              - ruff

          - name: pylint
            only: &pylint-config-present
              - run: |
                  [ -f pylintrc ] && exit 0
                  [ -f .pylintrc ] && exit 0
                  [ -f pylintrc.toml ] && exit 0
                  [ -f .pylintrc.toml ] && exit 0

                  if [ -f pyproject.toml ] &&
                     grep -Eq \
                       '^[[:space:]]*\[tool\.pylint([.][^]]+)?\]' \
                       pyproject.toml; then
                    exit 0
                  fi

                  if [ -f setup.cfg ] &&
                     grep -Eqi \
                       '^[[:space:]]*\[pylint([.][^]]+)?\]' \
                       setup.cfg; then
                    exit 0
                  fi

                  if [ -f tox.ini ] &&
                     grep -Eqi \
                       '^[[:space:]]*\[pylint([.][^]]+)?\]' \
                       tox.ini; then
                    exit 0
                  fi

                  exit 1
            glob:
              - "**/*.{py,pyi,pyw}"
            run: >-
              pylint -- {staged_files}
            tags:
              - lint
              - python
              - pylint
