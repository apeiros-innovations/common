[env]
_.python.venv = { path = ".venv", create = true }

POETRY_VIRTUALENVS_CREATE = "true"
POETRY_VIRTUALENVS_IN_PROJECT = "true"
POETRY_VIRTUALENVS_USE_POETRY_PYTHON = "false"

[tools]
python = "3.14.7"
"aqua:astral-sh/uv" = "0.12.9"

[tools."pipx:poetry"]
version = "2.4.2"
depends = ["python", "aqua:astral-sh/uv"]

[deps.poetry]
auto = false
run = "poetry sync --no-interaction --no-ansi"
timeout = "10m"
