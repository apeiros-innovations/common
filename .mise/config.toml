#:schema https://mise.jdx.dev/schema/mise.json

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
experimental = true

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
POETRY_VIRTUALENVS_CREATE = "true"
POETRY_VIRTUALENVS_IN_PROJECT = "true"
POETRY_VIRTUALENVS_USE_POETRY_PYTHON = "false"

[tools]
python = "3.14.10"
node = "26.12.1"
go = "1.27.3"
dotnet = "10.0.401"
pnpm = "12.15.0"

# Common
"npm:oxfmt" = "0.71.0"
"npm:cspell" = "10.4.0"
"npm:@commitlint/cli" = "21.2.4"
"npm:@commitlint/config-conventional" = "21.2.4"
"npm:markdownlint-cli2" = "0.23.3"
"aqua:astral-sh/uv" = "0.13.5"
"aqua:mvdan/sh" = "3.14.1"
"aqua:betterleaks/betterleaks" = "1.9.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:dotenv-linter/dotenv-linter" = "4.0.0"
"aqua:zizmorcore/zizmor" = "1.31.1"

"npm:oxlint" = "1.89.0"
"aqua:astral-sh/ruff" = "0.17.2"


# Go
"aqua:golangci/golangci-lint" = "2.15.0"
"go:golang.org/x/tools/cmd/goimports" = "v0.51.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

# Containers and infrastructure
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:aquasecurity/trivy" = "0.74.0"
"aqua:helm/helm" = "4.3.1"
"aqua:norwoodj/helm-docs" = "1.14.2"
"aqua:opentofu/opentofu" = "1.13.2"
"aqua:terraform-docs/terraform-docs" = "0.24.0"
"aqua:terraform-linters/tflint" = "0.64.0"
"aqua:gruntwork-io/terragrunt" = "1.2.1"
"aqua:google/osv-scanner" = { version = "2.7.0", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
"dotnet:Microsoft.CST.DevSkim.CLI" = { version = "1.0.100" }
"aqua:kjanat/actionlint" = "1.17.0"

"pipx:poetry" = { version = "2.5.1", depends = ["python", "aqua:astral-sh/uv"] }

"pipx:yamllint" = { version = "1.38.0", depends = [
  "python",
  "aqua:astral-sh/uv",
] }

"pipx:djlint" = { version = "1.47.0", depends = [
  "python",
  "aqua:astral-sh/ruff",
] }
"pipx:django-upgrade" = { version = "1.33.0", depends = [
  "python",
  "aqua:astral-sh/uv",
] }

"npm:renovate" = { version = "44.181.6", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

[deps.poetry]
auto = false
run = "poetry sync --no-interaction --no-ansi"
timeout = "10m"
