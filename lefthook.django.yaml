---
pre-commit:
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: format django templates
            only: &djlint-config-present
              - run: |
                  [ -f djlint.toml ] && exit 0
                  [ -f .djlint.toml ] && exit 0
                  [ -f .djlintrc ] && exit 0

                  if [ -f pyproject.toml ] &&
                     grep -Eq \
                       '^[[:space:]]*\[tool\.djlint([.][^]]+)?\]' \
                       pyproject.toml; then
                    exit 0
                  fi

                  exit 1
            glob:
              - "**/templates/**/*.{html,htm}"
            run: >-
              mise x -- djlint --profile=django --reformat --quiet {staged_files}
            stage_fixed: true
            tags:
              - format
              - django
              - templates
              - djlint

    - name: validate
      group:
        parallel: true
        jobs:
          - name: lint django templates
            only: *djlint-config-present
            glob:
              - "**/templates/**/*.{html,htm}"
            run: >-
              mise x -- djlint --profile=django --lint {staged_files}
            tags:
              - lint
              - django
              - templates
              - djlint
