---
extends:
  - lefthook.common.yaml
  - lefthook.python.yaml
  - lefthook.github.yaml
  - lefthook.renovate.yaml
  - lefthook/cspell.yaml
  - lefthook/cspell-repository.yaml
  - lefthook/commitlint.yaml
  - lefthook/signed-commits.yaml
pre-commit:
  jobs:
    - name: generate
      group:
        jobs:
          - name: export Mise GitHub tools
            glob:
              - .config/mise.toml
              - mise/github.toml
            run: |
              set -eu
              if ! git diff --quiet -- mise/github.toml; then
                printf >&2 'mise/github.toml: refusing to overwrite unstaged changes\n'
                exit 1
              fi
              mise run --skip-tools export:github
              git add -- mise/github.toml
            tags:
              - generation
              - mise
            file_types:
              - not symlink
