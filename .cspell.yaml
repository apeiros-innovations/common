---
# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
language: en
caseSensitive: false
allowCompoundWords: true
ignoreRandomStrings: true
useGitignore: true
dictionaryDefinitions:
  - name: apeiros
    path: ./cspell/dictionaries/apeiros.txt
    addWords: true
  - name: tools
    path: ./cspell/dictionaries/tools.txt
    addWords: true
  - name: pmp
    path: ./cspell/dictionaries/pmp.txt
  - name: government
    path: ./cspell/dictionaries/government.txt
dictionaries:
  - apeiros
  - tools
  - pmp
  - government
  - softwareTerms
  - node
  - npm
  - typescript
  - html
  - python
  - bash
  - golang
  - coding-compound-terms
  - computing-acronyms
  - filetypes
  - software-tools
  - k8s
  - cpp-compound-words
ignorePaths:
  - CHANGELOG.md
  - LICENSE
  - .mise/**
  - .vscode/**
  - pnpm-lock.yaml
  - package-lock.json
  - yarn.lock
patterns:
  - name: markdown-inline-code
    pattern: /`+[^`\r\n]*`+/g
  - name: markdown-backtick-code-blocks
    pattern: /^ {0,3}`{3,}[^\r\n]*\r?\n[\s\S]*?(?:^ {0,3}`{3,}[ \t]*$|$(?![\s\S]))/gm
  - name: markdown-tilde-code-blocks
    pattern: /^ {0,3}~{3,}[^\r\n]*\r?\n[\s\S]*?(?:^ {0,3}~{3,}[ \t]*$|$(?![\s\S]))/gm
languageSettings:
  - languageId: markdown
    ignoreRegExpList:
      - markdown-inline-code
      - markdown-backtick-code-blocks
      - markdown-tilde-code-blocks
words:
  - diátaxis
  - workerd
  - kics
  - tamasfe
  - gpgsig
