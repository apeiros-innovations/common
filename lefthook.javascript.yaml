---
pre-commit:
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: format javascript typescript
            glob:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - javascript
              - typescript
              - oxfmt

    - name: validate
      group:
        parallel: true
        jobs:
          - name: oxlint
            only:
              - run: >-
                  test -f .oxlintrc.json || test -f .oxlintrc.jsonc || test -f oxlint.config.ts || test -f oxlint.config.mts
            glob:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
              - "**/*.{astro,vue,svelte}"
            run: >-
              mise x -- oxlint --deny-warnings -- {staged_files}
            tags:
              - lint
              - javascript
              - typescript
              - framework
              - oxlint
