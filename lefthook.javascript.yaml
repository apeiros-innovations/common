---
pre-commit:
  jobs:
    - name: validate
      group:
        parallel: true
        jobs:
          - name: oxlint
            glob:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
              - "**/*.{astro,vue,svelte}"
            run: oxlint --deny-warnings -- {staged_files}
            tags:
              - lint
              - javascript
              - typescript
              - framework
              - oxlint
