---
min_version: "2.1.10"
assert_lefthook_installed: true
glob_matcher: doublestar

output:
  - meta
  - summary
  - jobs

commit-msg:
  jobs:
    - name: commitlint
      script: commitlint
      runner: bash
      args: "{1}"
      tags:
        - lint
        - git
        - commit-message
        - commitlint

pre-commit:
  parallel: false

  skip:
    - merge
    - rebase

  jobs:
    - name: format
      exclude:
        - "**/schemas/**"
      group:
        parallel: true
        jobs:
          - name: format just
            glob:
              - "**/*.just"
              - "**/{.justfile,justfile,Justfile}"
            run: |
              mise x -- \
                bash -eu -c '
                  for file do
                    just --justfile "$file" --fmt
                  done
                ' -- {staged_files}
            stage_fixed: true
            tags:
              - format
              - just

          - name: format mise
            glob:
              - ".config/mise/config.toml"
              - ".config/mise/conf.d/*.toml"
              - "mise.lock"
            run: mise fmt
            stage_fixed: true
            tags:
              - format
              - mise

          - name: format json
            glob:
              - "**/*.{json,json5,jsonc}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - json
              - oxfmt

          - name: format markdown
            glob:
              - "**/*.{md,markdown,mdx}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - markdown
              - mdx
              - oxfmt

          - name: format css
            glob:
              - "**/*.{css,scss,less,pcss,postcss}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - css
              - oxfmt

          - name: format html
            glob:
              - "**/*.{html,htm,xhtml}"
            exclude:
              - "**/templates/**"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - html
              - oxfmt

          - name: format graphql
            glob:
              - "**/*.{graphql,gql,graphqls}"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - graphql
              - oxfmt

          - name: format toml
            glob:
              - "**/*.toml"
            exclude:
              - ".config/mise/config.toml"
              - ".config/mise/conf.d/*.toml"
            script: oxfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - toml
              - oxfmt

          - name: format yaml
            glob:
              - "**/*.{yaml,yml}"
            exclude:
              - "**/templates/**"
            script: yamlfmt
            runner: bash
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - yaml
              - yamlfmt

          - name: format shell
            glob:
              - "**/*.{sh,bash,ksh}"
            run: >-
              mise x -- shfmt -w -s {staged_files}
            stage_fixed: true
            tags:
              - format
              - shell
              - shfmt

          - name: text hygiene
            exclude:
              - "**/*.go"
              - "**/*.rs"
              - "**/*.{py,pyi,pyw}"
              - "**/*.just"
              - "**/*.{json,json5,jsonc}"
              - "**/*.{md,markdown,mdx}"
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
              - "**/*.{astro,vue,svelte}"
              - "**/*.{css,scss,less,pcss,postcss}"
              - "**/*.{html,htm,xhtml}"
              - "**/*.{graphql,gql,graphqls}"
              - "**/*.toml"
              - "**/*.{yaml,yml}"
              - "**/*.{sh,bash,ksh}"
              - "**/*.{tf,tofu,tfvars,hcl}"
              - "**/{.justfile,justfile,Justfile}"
              - ".config/mise/config.toml"
              - ".config/mise/conf.d/*.toml"
              - "mise.lock"
            file_types:
              - text
              - not symlink
            script: text-hygiene.py
            runner: mise x -- python3
            args: "{staged_files}"
            stage_fixed: true
            tags:
              - format
              - text

          - name: shebang permissions
            exclude:
              - "**/{.justfile,justfile,Justfile}"
              - "**/*.just"
            file_types:
              - text
              - not symlink
            script: shebang-permissions.py
            runner: mise x -- python3
            args: "{staged_files}"
            tags:
              - validation
              - repository
              - permissions

    - name: generate
      group:
        parallel: true
        jobs:
          - name: mise lock
            glob:
              - ".config/mise/config.toml"
              - ".config/mise/conf.d/*.toml"
              - "mise.lock"
            run: |
              mise lock

              if [ ! -f mise.lock ]; then
                printf >&2 \
                  'mise.lock: missing after `mise lock`; ensure [settings].lockfile = true\n'
                exit 1
              fi

              git add -- mise.lock
            tags:
              - generation
              - mise
              - dependencies
              - supply-chain

    - name: validate
      group:
        parallel: true
        jobs:
          - name: git diff check
            exclude:
              - "schemas/**"
            run: >-
              git --no-pager diff --cached --check --no-ext-diff --no-textconv -- {staged_files}
            tags:
              - validation
              - git
              - repository

          - name: check path portability
            script: check-path-portability.py
            runner: mise x -- python3
            tags:
              - validation
              - repository
              - portability

          - name: check json
            glob:
              - "**/*.json"
            script: check-json.py
            runner: mise x -- python3
            args: "{staged_files}"
            tags:
              - validation
              - json
              - repository

          - name: lint yaml
            glob:
              - "**/*.{yaml,yml}"
            exclude:
              - "**/templates/**"
            script: yamllint
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - yaml
              - yamllint

          - name: shellcheck
            glob:
              - "**/*.{sh,bash,bats,ksh}"
            script: shellcheck
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - shell
              - shellcheck

          - name: dotenv
            glob:
              - "**/.env"
              - "**/.env.*"
            run: >-
              mise x -- dotenv-linter check {staged_files}
            tags:
              - lint
              - environment
              - dotenv

          - name: cspell
            exclude:
              - "**/*.svg"
            file_types:
              - text
              - not symlink
            script: cspell
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - spelling
              - cspell

          - name: editorconfig
            only: &editorconfig-present
              - run: >-
                  git ls-files --error-unmatch -- '.editorconfig' ':(glob)**/.editorconfig' >/dev/null 2>&1
            file_types:
              - text
              - not symlink
            run: >-
              mise x -- ec --disable-indentation --disable-indent-size --disable-max-line-length {staged_files}
            tags:
              - lint
              - editorconfig
              - repository

          - name: markdownlint
            glob:
              - "**/*.{md,markdown}"
            script: markdownlint
            runner: bash
            args: "{staged_files}"
            tags:
              - lint
              - markdown
              - markdownlint

          - name: check added large files
            script: check-large-files.py
            runner: mise x -- python3
            args: "{staged_files}"
            tags:
              - validation
              - repository
              - large-files

          - name: check symlinks
            script: check-symlinks.py
            runner: mise x -- python3
            args: "{staged_files}"
            tags:
              - validation
              - repository
              - symlinks

          - name: check gitlinks
            script: check-gitlinks.py
            runner: mise x -- python3
            tags:
              - validation
              - repository
              - submodules

          - name: check forced ignored files
            script: check-forced-ignored-files.py
            runner: mise x -- python3
            args: "{staged_files}"
            tags:
              - validation
              - repository
              - gitignore

          - name: betterleaks
            script: betterleaks
            runner: bash
            tags:
              - security
              - secrets
              - betterleaks

pre-push:
  jobs:
    - name: signed commits
      script: check-signed-commits.py
      runner: mise x -- python3
      use_stdin: true
      tags:
        - validation
        - git
        - signatures

    - name: repository validation
      group:
        parallel: true
        jobs:
          - name: cspell repository
            script: cspell
            runner: bash
            args: "--repository"
            tags:
              - lint
              - spelling
              - cspell

          - name: editorconfig repository
            only: *editorconfig-present
            run: >-
              mise x -- ec --disable-indentation --disable-indent-size --disable-max-line-length
            tags:
              - lint
              - editorconfig
              - repository
