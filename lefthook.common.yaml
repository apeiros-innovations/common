---
assert_lefthook_installed: true
skip_lfs: true

output:
  - meta
  - summary
  - jobs
  - failure

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit {1}
      fail_text: |
        Commit message failed conventional commit validation.
        Example:
          chore(deps): short description

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase

  jobs:
    - name: format go
      glob:
        - "*.go"
      run: gofmt -s -w {staged_files}
      stage_fixed: true
      tags:
        - format

    - name: format rust
      glob:
        - "*.rs"
      run: cargo fmt --all
      stage_fixed: true
      tags:
        - format

    - name: format just
      glob:
        - "*.just"
        - ".justfile"
      run: for f in {staged_files}; do just --justfile "$f" --fmt; done
      stage_fixed: true
      tags:
        - format

    - name: format mise
      glob:
        - ".mise.toml"
        - ".mise/config.toml"
      run: mise fmt
      stage_fixed: true
      tags:
        - format

    - name: format json
      glob:
        - "*.json"
        - "*.json5"
        - "*.jsonc"
      run: oxfmt {staged_files}
      stage_fixed: true
      tags:
        - format

    - name: format markdown
      glob:
        - "*.md"
        - "*.markdown"
        - "*.mdx"
      run: oxfmt {staged_files}
      stage_fixed: true
      tags:
        - format

    - name: format yaml
      glob:
        - "*.yaml"
        - "*.yml"
      run: yamlfmt {staged_files}
      stage_fixed: true
      tags:
        - format

    - name: mise lock
      glob:
        - ".mise.toml"
        - ".mise/config.toml"
      run: mise lock && { for f in {staged_files}; do l="$(dirname "$f")/mise.lock"; [ -f "$l" ] && git add "$l"; done; true; }

    - name: shellcheck
      glob:
        - "*.sh"
      run: shellcheck {staged_files}

    - name: zizmor
      glob:
        - ".github/workflows/*.yaml"
        - ".github/actions/**/action.yaml"
      run: zizmor --offline {staged_files}

    - name: spellcheck
      glob:
        - "**/*.{md,markdown,mdx}"
      run: cspell lint --no-progress --no-must-find-files -- {staged_files}
