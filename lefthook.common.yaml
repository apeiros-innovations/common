---
min_version: "2.1.10"
assert_lefthook_installed: true
glob_matcher: doublestar

output:
  - meta
  - summary
  - jobs

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit {1}

pre-commit:
  piped: true
  skip:
    - merge
    - rebase

  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: format go
            glob:
              - "**/*.go"
            run: gofmt -s -w {staged_files}
            stage_fixed: true
            tags:
              - format
              - go

          - name: format rust
            glob:
              - "**/*.rs"
            run: cargo fmt --all
            stage_fixed: true
            tags:
              - format
              - rust

          - name: format just
            glob:
              - "**/*.just"
              - "**/{.justfile,justfile,Justfile}"
            run: for f in {staged_files}; do just --justfile "$f" --fmt; done
            stage_fixed: true
            tags:
              - format
              - just

          - name: mise
            glob:
              - ".mise.toml"
              - ".mise/config.toml"
            group:
              piped: true
              jobs:
                - name: format mise
                  run: mise fmt
                  stage_fixed: true
                  tags:
                    - format
                    - mise

                - name: mise lock
                  run: |
                    mise lock && {
                      for f in {staged_files}; do
                        lock_file="$(dirname "$f")/mise.lock"
                        [ -f "$lock_file" ] && git add "$lock_file"
                      done
                      true
                    }
                  tags:
                    - mise

          - name: format json
            glob:
              - "**/*.{json,json5,jsonc}"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - json
              - oxfmt

          - name: format markdown
            glob:
              - "**/*.{md,markdown,mdx}"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - markdown
              - oxfmt

          - name: format javascript typescript
            glob:
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - javascript
              - typescript
              - oxfmt

          - name: format css
            glob:
              - "**/*.{css,scss,less,pcss,postcss}"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - css
              - oxfmt

          - name: format html
            glob:
              - "**/*.{html,htm,xhtml}"
            exclude:
              - "**/templates/**"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - html
              - oxfmt

          - name: format graphql
            glob:
              - "**/*.{graphql,gql,graphqls}"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - graphql
              - oxfmt

          - name: format toml
            glob:
              - "**/*.toml"
            exclude:
              - ".mise.toml"
              - ".mise/config.toml"
            run: oxfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - toml
              - oxfmt

          - name: format yaml
            glob:
              - "**/*.{yaml,yml}"
            exclude:
              - "**/templates/**"
            run: yamlfmt {staged_files}
            stage_fixed: true
            tags:
              - format
              - yaml

          - name: format shell
            glob:
              - "**/*.{sh,bash,ksh}"
            run: shfmt -w -s {staged_files}
            stage_fixed: true
            tags:
              - format
              - shell

          - name: text hygiene
            exclude:
              - "**/*.go"
              - "**/*.rs"
              - "**/*.{py,pyi,pyw}"
              - "**/*.just"
              - "**/*.{json,json5,jsonc}"
              - "**/*.{md,markdown,mdx}"
              - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
              - "**/*.{css,scss,less,pcss,postcss}"
              - "**/*.{html,htm,xhtml}"
              - "**/*.{graphql,gql,graphqls}"
              - "**/*.toml"
              - "**/*.{yaml,yml}"
              - "**/*.{sh,bash,ksh}"
              - "**/{.justfile,justfile,Justfile}"
              - ".mise.toml"
              - ".mise/config.toml"
            group:
              piped: true
              jobs:
                - name: trailing whitespace
                  file_types:
                    - text
                    - not symlink
                  run: >-
                    perl -i -pe 's/[\t\f\x0b ]+(?=\r?$)//' -- {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - text

                - name: end of file fixer
                  file_types:
                    - text
                    - not symlink
                  run: |
                    perl -0777 -i -pe '
                      if (length) {
                        my $eol = /\r\n\z/ ? "\r\n" : /\r\z/ ? "\r" : "\n";
                        s/(?:\r\n|\r|\n)+\z//;
                        $_ .= $eol if length;
                      }
                    ' -- {staged_files}
                  stage_fixed: true
                  tags:
                    - format
                    - text

          - name: fix shebang script permissions
            exclude:
              - "**/{.justfile,justfile,Justfile}"
              - "**/*.just"
            file_types:
              - text
              - not symlink
            run: |
              bash -eu -c '
                for file do
                  [ -f "$file" ] || continue

                  prefix=$(git show ":$file" 2>/dev/null | LC_ALL=C head -c 2)
                  [ "$prefix" = "#!" ] || continue

                  mode=$(git ls-files --stage -- "$file" | awk "NR == 1 { print \$1 }")
                  [ "$mode" = "100755" ] && continue
                  [ "$mode" = "100644" ] || continue

                  chmod +x -- "$file"
                  git update-index --chmod=+x -- "$file"

                  printf "%s: marked executable\n" "$file"
                done
              ' -- {staged_files}
            tags:
              - format
              - repository
              - permissions

    - name: validate
      group:
        parallel: true
        jobs:
          - name: lint yaml
            glob:
              - "**/*.{yaml,yml}"
            exclude:
              - "**/templates/**"
            run: yamllint {staged_files}
            tags:
              - lint
              - yaml

          - name: hadolint
            glob:
              - "**/{Dockerfile,Containerfile}"
              - "**/{Dockerfile,Containerfile}.*"
              - "**/*.{Dockerfile,Containerfile}"
            run: hadolint -- {staged_files}
            tags:
              - lint
              - security
              - container

          - name: shellcheck
            glob:
              - "**/*.{sh,bash,bats,ksh}"
            run: shellcheck {staged_files}
            tags:
              - lint
              - shell

          - name: cspell
            file_types:
              - text
              - not symlink
            run: >-
              cspell lint --no-progress --no-must-find-files -- {staged_files}
            tags:
              - lint
              - spelling
              - cspell

          - name: editorconfig
            file_types:
              - text
              - not symlink
            run: |
              if [ -f .editorconfig ]; then
                ec \
                  --disable-indentation \
                  --disable-indent-size \
                  {staged_files}
              fi
            tags:
              - lint
              - editorconfig
              - repository

          - name: markdownlint
            glob:
              - "**/*.{md,markdown}"
            run: markdownlint-cli2 --no-globs -- {staged_files}
            tags:
              - lint
              - markdown

          - name: check added large files
            run: |
              bash -eu -c '
                failed=0

                for file do
                  if git diff --cached --quiet --diff-filter=A -- "$file"; then
                    continue
                  fi

                  lfs_attr=$(git check-attr filter -- "$file")
                  case "$lfs_attr" in
                    *": filter: lfs") continue ;;
                  esac

                  size=$(git cat-file -s ":$file")
                  if [ "$size" -gt 1048576 ]; then
                    kib=$(((size + 1023) / 1024))
                    printf "%s (%s KiB) exceeds the 1024 KiB limit\n" \
                      "$file" \
                      "$kib" >&2
                    failed=1
                  fi
                done

                exit "$failed"
              ' -- {staged_files}
            tags:
              - validation
              - repository

          - name: check executables have shebangs
            exclude:
              - "**/{.justfile,justfile,Justfile}"
              - "**/*.just"
            file_types:
              - text
              - not symlink
            run: |
              bash -eu -c '
                failed=0

                for file do
                  mode=$(git ls-files --stage -- "$file" | awk "NR == 1 { print \$1 }")
                  [ "$mode" = "100755" ] || continue

                  prefix=$(git show ":$file" 2>/dev/null | LC_ALL=C head -c 2)
                  if [ "$prefix" != "#!" ]; then
                    printf "%s: executable file has no shebang\n" "$file" >&2
                    failed=1
                  fi
                done

                exit "$failed"
              ' -- {staged_files}
            tags:
              - validation
              - repository

          - name: betterleaks
            run: >-
              betterleaks git . --pre-commit --staged --redact --no-banner
            tags:
              - security
              - secrets
              - betterleaks

          - name: trivy dockerfile
            glob:
              - "**/{Dockerfile,Containerfile}"
              - "**/{Dockerfile,Containerfile}.*"
              - "**/*.{Dockerfile,Containerfile}"
            run: |
              bash -eu -c '
                failed=0

                for file do
                  [ -f "$file" ] || continue

                  trivy config \
                    --quiet \
                    --misconfig-scanners dockerfile \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    "$file" ||
                    failed=1
                done

                exit "$failed"
              ' -- {staged_files}
            tags:
              - security
              - trivy
              - container

pre-push:
  jobs:
    - name: repository validation
      group:
        parallel: true
        jobs:
          - name: cspell repository
            run: |
              git ls-files -z |
                xargs -0 -r cspell lint \
                  --no-progress \
                  --no-must-find-files \
                  --
            tags:
              - lint
              - spelling - cspell

    - name: editorconfig repository
      run: |
        if [ -f .editorconfig ]; then
          ec
        fi
      tags:
        - lint
        - editorconfig
        - repository
